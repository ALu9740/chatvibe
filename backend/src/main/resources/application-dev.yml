# 开发环境配置
# 所有敏感信息通过环境变量注入，请在 backend/.env 文件中配置（.env 不会被上传到 GitHub）
# 可从 .env.example 复制并填入你的本地配置

server:
  ssl:
    enabled: ${SSL_ENABLED:true}
    certificate: ${SSL_CERT_PATH:classpath:ssl/chatvibe.icu+3.pem}
    certificate-private-key: ${SSL_KEY_PATH:classpath:ssl/chatvibe.icu+3-key.pem}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:chatvibe}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      # 设置 MySQL 会话时区为 +08:00，确保 NOW() 返回北京时间
      # 与 Java LocalDateTime.now()（JVM 时区 Asia/Shanghai）保持一致
      # 否则 clearHistory/restoreMember 的 NOW() 返回 UTC 时间，
      # 导致 m.created_at(北京时间) >= cm.created_at(UTC) 恒为 true，过滤失效
      connection-init-sql: SET time_zone = '+08:00'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:5}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
          max-wait: -1ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          starttls:
            enable: true
  # Spring AI 单供应商模式配置（仅 failover.enabled=false 时生效）
  # 开发环境默认指向本地 Ollama，避免误连外部 API
  # failover.enabled=true 时此配置不生效，由 providerChatClients() 按列表构建
  ai:
    openai:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      api-key: dummy
      chat:
        options:
          model: ${OLLAMA_MODEL:deepseek-r1:8b}

logging:
  level:
    root: info
    com.chatvibe: debug
    org.springframework.web: debug
    com.baomidou.mybatisplus: debug

chatvibe:
  ai:
    # 开发环境：Ollama 本地为主，Qwen 百炼兜底
    # 本地 Ollama 无需 API Key、无网络延迟，适合开发调试
    # Ollama 不可用时自动切换到阿里云百炼 qwen3.7-flash
    provider: ollama
    failover:
      providers:
        # 优先级 1：本地 Ollama（开发主供应商）
        - name: ollama
          base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
          api-key: dummy
          model: ${OLLAMA_MODEL:deepseek-r1:8b}
          enabled: true
        # 优先级 2：阿里云百炼 Qwen（开发兜底供应商）
        - name: qwen
          base-url: https://dashscope.aliyuncs.com/compatible-mode
          api-key: ${QWEN_API_KEY:dummy}
          model: ${QWEN_MODEL:qwen3.6-flash}
          enabled: true
