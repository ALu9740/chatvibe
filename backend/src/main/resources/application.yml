spring:
  profiles:
    active: dev
  application:
    name: chatvibe
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: caffeine
    cache-names:  userInfo,userEmail,emailExists,userNotifyPrefs
  ai:
    openai:
      # Spring AI 自动配置（单供应商模式 / failover.enabled=false 时使用）
      # 按 provider 选择 base-url:
      #   qwen   -> https://dashscope.aliyuncs.com/compatible-mode   (DashScope OpenAI 兼容模式)
      #   ollama -> http://localhost:11434                            (Ollama OpenAI 兼容端点 /v1/chat/completions)
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${AI_API_KEY:dummy}
      chat:
        options:
          model: ${AI_MODEL:qwen3.6-flash}
          temperature: 0.7

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

jwt:
  # JWT 密钥：生产环境务必通过环境变量 JWT_SECRET 注入，至少 256 bits
  secret: ${JWT_SECRET:chatvibe-dev-secret-key-change-in-production-must-be-256-bits}
  access-token-expiration: 7200000      # 2小时
  refresh-token-expiration: 604800000   # 7天

chatvibe:
  ai:
    # AI 提供商: qwen（阿里云百炼） | ollama（本地）
    # 两者均通过 Spring AI 的 OpenAI 兼容客户端调用，仅 base-url / api-key / model 不同
    provider: ${AI_PROVIDER:ollama}
    # 多供应商故障转移配置
    # enabled=true 时启用 FailoverAiService 责任链，按优先级逐个尝试
    # enabled=false 时退回单供应商模式（SpringAiChatService）
    # providers 列表在 application-dev.yml / application-prod.yml 中按环境配置
    failover:
      enabled: ${AI_FAILOVER_ENABLED:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:}
    url-prefix: ${MINIO_URL_PREFIX:/minio}

resilience4j:
  ratelimiter:
    instances:
      loginRateLimiter: # 登录限流
        limit-for-period: 10          # 每周期最多 10 次
        limit-refresh-period: 1s      # 1 秒一周期 → 10 QPS
        timeout-duration: 0           # 超限不等待，直接拒绝
      resetPasswordRateLimiter: # 重置密码限流
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0
      userInfoRateLimiter: # 用户信息查询限流
